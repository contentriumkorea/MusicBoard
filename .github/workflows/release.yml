name: PulseDeck
on:
  push:
    branches: ['main']
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sono-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/native-build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-installers-*
          path: installers
          merge-multiple: true
      - name: Validate release assets
        run: node scripts/verify-native-assets.mjs installers
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Increase package.json version to publish an update."
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "PulseDeck ${version}" --notes-file docs/release-notes.md installers/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
